<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>눈사람 만들기</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d1b2e;user-select:none;-webkit-user-select:none}
html.overlay,html.overlay body{background:transparent}
canvas{display:block;touch-action:none}
#hint{position:fixed;left:50%;top:16px;transform:translateX(-50%);color:#eaf4ff;font:13px/1.6 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:rgba(12,28,50,.62);padding:9px 16px;border-radius:14px;pointer-events:none;transition:opacity 1.2s;text-align:center;white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.25)}
@media (max-width:760px){#hint{white-space:normal;width:calc(100% - 64px)}}

<body>
<canvas id="c"></canvas>
<div id="hint">❄ 눈덩이를 <b>좌우로 굴려</b> 키우기 · <b>위로 들어</b> 다른 눈덩이 위에 올리기 · <b>맨 위 눈덩이 클릭</b> = 꾸미기<br>🎁 튀어나온 아이템은 <b>화면 맨 위로 끌어올려</b> 매달기 · 마우스로 쓸면 흔들흔들 · 눈사람을 높이서 떨어뜨리면 와르르!</div>
<script>
'use strict';
/* ================= 기본 설정 ================= */
let OV = window.snowOverlay || null;                // Electron 오버레이 모드일 때만 존재
if (!OV && typeof require === 'function') {
  try { const { ipcRenderer } = require('electron'); OV = { setIgnore: v => ipcRenderer.send('set-ignore', v), quit: () => ipcRenderer.send('quit') }; } catch (_) { }
}
const IS_OVERLAY = !!OV || /overlay/.test(location.search);
if (IS_OVERLAY) document.documentElement.classList.add('overlay');

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hintEl = document.getElementById('hint');
let W, H, DPR, TASKBAR, GROUND;
const COL = 4, SNOW_BASE = 26;
const G = 1800;                 // 중력 px/s²
const MINR = 12, START_R = 14, MAXR = 54;   // 눈덩이 최대 크기 제한
const CRASH_V = 720;            // 이 속도 이상으로 떨어지면 눈사람 붕괴
const SCULPT_DUR = 2.6;
const HANG_ZONE = () => Math.min(240, H * 0.3);

let snowH = [], snowT = [];
let stacks = [], items = [], parts = [], flakes = [], stars = [], icicles = [];
let mouse = { x: -999, y: -999, svx: 0, svy: 0, t: 0 };
let drag = null, time = 0, best = 0, hoverState = false, statueNo = 0;

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
// 언어: ?lang=zh 이면 중국어
const LANG = /lang=zh/.test(location.search) ? 'zh' : 'ko';
const tr = (ko, zh) => LANG === 'zh' ? zh : ko;
const FONT = LANG === 'zh' ? '"Microsoft YaHei","PingFang SC",sans-serif' : '"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
if (LANG === 'zh') {
  document.documentElement.lang = 'zh';
  document.title = '堆雪人';
  document.getElementById('hint').innerHTML = '❄ <b>左右拖动</b>雪球让它变大 · <b>向上拎起</b>放到另一个雪球上 · <b>点击最上面的雪球</b> = 装扮<br>🎁 蹦出来的道具<b>拖到屏幕最上方</b>就能挂起来 · 鼠标扫过会晃来晃去 · 把雪人从高处扔下会摔散！';
  document.getElementById('hint').style.fontFamily = '"Microsoft YaHei","PingFang SC",sans-serif';
}
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

/* ================= 화면 / 눈 바닥 ================= */
function resize() {
  DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  TASKBAR = IS_OVERLAY ? 0 : 48; GROUND = H - TASKBAR;
  const n = Math.ceil(W / COL) + 2; snowH = []; snowT = [];
  for (let i = 0; i < n; i++) {
    const t = SNOW_BASE + 5 * Math.sin(i * 0.06) + 3 * Math.sin(i * 0.17 + 2) + 2 * Math.sin(i * 0.011);
    snowT.push(t); snowH.push(t);
  }
  stars = []; for (let i = 0; i < 90; i++) stars.push({ x: Math.random() * W, y: Math.random() * H * 0.6, r: rand(0.4, 1.4), p: rand(0, 6) });
  icicles = []; for (let x = 10; x < W; x += rand(18, 60)) icicles.push({ x, l: rand(5, 16), w: rand(3, 6) });
  flakes = []; const fc = IS_OVERLAY ? 45 : 110;
  for (let i = 0; i < fc; i++) flakes.push(newFlake(true));
}
function newFlake(any) { return { x: Math.random() * W, y: any ? Math.random() * H : -5, r: rand(0.8, 2.6), vy: rand(25, 60), ph: rand(0, 6) }; }
function snowTop(x) {
  const f = x / COL; const i = clamp(Math.floor(f), 0, snowH.length - 2); const t = clamp(f - i, 0, 1);
  return GROUND - (snowH[i] * (1 - t) + snowH[i + 1] * t);
}
function digSnow(x, w, amt) {
  const i0 = Math.max(0, Math.floor((x - w) / COL)), i1 = Math.min(snowH.length - 1, Math.ceil((x + w) / COL));
  for (let i = i0; i <= i1; i++) {
    const f = 1 - Math.abs(i * COL - x) / w; if (f <= 0) continue;
    const take = Math.min(amt * f, snowH[i] - 7); if (take > 0) snowH[i] -= take;
  }
}

/* ================= 눈덩이 / 눈더미(stack) ================= */
function makeBall(r) {
  const dots = []; for (let i = 0; i < 11; i++) dots.push({ a: rand(0, 6.28), d: rand(0.2, 0.85), s: rand(0.6, 1.7) });
  return { r, ox: 0, rot: rand(0, 6.28), dots, pop: null };
}
function makeStack(x, y, balls, state) {
  return { balls, x, y, vx: 0, vy: 0, cvx: 0, theta: 0, omega: 0, state: state || 'fall', deco: null, creep: 0, danger: 0, skip: null };
}
// 로컬 좌표 + 월드 좌표 계산 (s.x,s.y = 맨 아래 눈덩이의 바닥 접점)
function layout(s) {
  const out = []; let cx = 0, cy = 0, prev = null;
  for (let i = 0; i < s.balls.length; i++) {
    const b = s.balls[i];
    if (i === 0) { cx = 0; cy = -b.r * 0.92; } else { cx += b.ox; cy -= (prev.r + b.r) * 0.82; }
    out.push({ lx: cx, ly: cy, r: b.r, b }); prev = b;
  }
  const c = Math.cos(s.theta), sn = Math.sin(s.theta);
  for (const p of out) { p.x = s.x + p.lx * c - p.ly * sn; p.y = s.y + p.lx * sn + p.ly * c; }
  return out;
}
function totalBalls() { let n = 0; for (const s of stacks) n += s.balls.length; return n; }

function spawnBall(x) {
  const s = makeStack(x, snowTop(x), [makeBall(START_R)], 'ground');
  s.balls[0].pop = 0; stacks.unshift(s); puff(x, snowTop(x) - 4, 6);
}
let spawnTimer = 0;
function spawner(dt) {
  spawnTimer -= dt; if (spawnTimer > 0) return; spawnTimer = 1.6;
  let small = 0;
  for (const s of stacks) if (s.balls.length === 1 && s.balls[0].r < 24 && s.state === 'ground' && !s.melt) small++;
  if (small >= 2 || totalBalls() >= 18) return;
  for (let k = 0; k < 14; k++) {
    const x = rand(60, W - 60);
    if (stacks.every(s => Math.abs(s.x - x) > s.balls[0].r + 50)) { spawnBall(x); return; }
  }
}

/* ================= 물리 업데이트 ================= */
function updGround(s, dt) {
  const b0 = s.balls[0];
  if (s.balls.length === 1) {
    s.theta = 0; s.omega = 0;
    if (!(drag && drag.s === s)) {
      s.x += s.vx * dt; b0.rot += s.vx * dt / b0.r;
      s.vx *= Math.pow(0.12, dt); if (Math.abs(s.vx) < 3) s.vx = 0;
    }
  } else wobble(s, dt);
  s.x = clamp(s.x, b0.r, W - b0.r);
  s.y = snowTop(s.x) + b0.r * 0.08;
}
// 무게중심 기반 기우뚱 + 임계점 붕괴
function wobble(s, dt) {
  const L = layout(s); let M = 0, cxw = 0, cxl = 0;
  for (const p of L) { const m = p.r * p.r; M += m; cxw += m * (p.x - s.x); cxl += m * p.lx; }
  cxw /= M; cxl /= M;
  const n = s.balls.length, br = s.balls[0].r;
  const Il = cxl / br, Iw = cxw / br;
  if (n >= 3) {
    const thr = Math.max(0.12, 0.3 - 0.05 * (n - 3));
    if (Math.abs(Iw) > thr) s.creep += Math.sign(Iw) * (Math.abs(Iw) - thr) * 0.75 * (n - 2) * dt;
    else s.creep *= Math.pow(0.4, dt);
  } else s.creep *= Math.pow(0.2, dt);
  const K = Math.max(6, 34 - n * 5), D = n <= 2 ? 3 : 0.8;
  const eq = Il * 0.05 * n + s.creep;
  let alpha = -K * (s.theta - eq) - D * s.omega;
  if (n >= 3) alpha += (Math.random() - 0.5) * (n - 2) * (0.8 + Math.abs(Il) * 7);
  s.omega += alpha * dt; s.theta += s.omega * dt;
  const ratio = Math.abs(cxw) / (br * 0.95);
  s.danger += (ratio - s.danger) * Math.min(1, dt * 6);
  if (ratio > 1 || Math.abs(s.theta) > 0.75) collapse(s, Math.sign(cxw) || 1);
}
function updCarry(s, dt) {
  const b0 = s.balls[0];
  const nx = clamp(mouse.x + drag.offX, b0.r, W - b0.r);
  const ny = Math.min(mouse.y + drag.offY, snowTop(nx) + b0.r * 0.08);
  s.cvx += ((nx - s.x) / dt - s.cvx) * 0.3;
  s.x = nx; s.y = ny;
  const alpha = -40 * s.theta - 5 * s.omega - s.cvx * 0.012;
  s.omega += alpha * dt; s.theta = clamp(s.theta + s.omega * dt, -0.5, 0.5);
}
function updFall(s, dt) {
  const b0 = s.balls[0];
  s.vy += G * dt; s.x += s.vx * dt; const prevY = s.y; s.y += s.vy * dt;
  s.theta *= Math.pow(0.1, dt); s.omega *= 0.9;
  if (s.balls.length === 1) b0.rot += s.vx * dt / b0.r;
  if (s.x < b0.r) { s.x = b0.r; s.vx = Math.abs(s.vx) * 0.4; }
  if (s.x > W - b0.r) { s.x = W - b0.r; s.vx = -Math.abs(s.vx) * 0.4; }
  // 다른 눈더미 위에 착지?
  if (s.vy > 0 && !s.debris) for (const t of stacks) {
    if (t === s || t.dead || t.state !== 'ground' || t === s.skip) continue;
    const L = layout(t), top = L[L.length - 1], surf = top.y - top.r * 0.78;
    if (prevY <= surf + 3 && s.y >= surf && Math.abs(s.x - top.x) < top.r + b0.r * 0.5) {
      if (Math.abs(s.x - top.x) > top.r * 0.92) { s.skip = t; s.vx += Math.sign(s.x - top.x) * 160; continue; }
      landOn(s, t, top, surf); return;
    }
  }
  const gy = snowTop(s.x) + b0.r * 0.08;
  if (s.y >= gy) {
    s.y = gy;
    if (s.balls.length >= 2 && s.vy > CRASH_V) { collapse(s, Math.sign(s.vx) || pick([-1, 1])); return; }
    if (s.balls.length === 1 && s.vy > 380) { s.vy *= -0.3; s.vx *= 0.8; puff(s.x, gy - 2, 4); return; }
    if (s.vy > 200) puff(s.x, gy - 2, 3 + s.balls.length);
    if (s.balls.length > 1) { s.omega += s.vx * 0.0015 + rand(-0.2, 0.2) + s.vy * 0.0003 * pick([-1, 1]); s.vx = 0; }
    s.vy = 0; s.state = 'ground'; s.skip = null; s.debris = false;
  }
}
function landOn(s, t, top, surf) {
  const dx = s.x - top.x, impact = s.vy;
  const tn = t.balls.length;
  if (t.deco) popDeco(t);
  s.balls[0].ox = dx / Math.cos(t.theta);
  t.balls.push(...s.balls);
  t.deco = s.deco; // 올린 쪽의 장식은 그대로 유지 (맨 위에 있으므로)
  s.dead = true;
  if (drag && drag.s === s) drag = null;
  t.omega += (dx / top.r) * 0.9 + rand(-0.25, 0.25) + impact * 0.0004 * (Math.sign(dx) || pick([-1, 1]));
  puff(top.x, surf, 6);
  const n = t.balls.length;
  if (n > best) best = n;
  if ((s.balls.length >= 2 && impact > CRASH_V) || impact > 1250) { collapse(t, Math.sign(dx) || 1); return; }
  if (n >= 3) floatText(tr(`${n}단!${n >= 4 ? ' 아슬아슬…' : ''}`, `${n}层！${n >= 4 ? ' 摇摇欲坠…' : ''}`), top.x, surf - 40, n >= 4 ? '#ffd166' : '#ffffff', 22);
}
function collapse(s, dir) {
  if (s.dead) return;
  const L = layout(s); s.dead = true;
  if (drag && drag.s === s) drag = null;
  if (s.deco) popDeco(s);
  // 눈덩이를 남기지 않고 전부 눈가루 조각으로 부서짐
  for (const p of L) {
    const cnt = Math.round(12 + p.r * 0.55);
    for (let k = 0; k < cnt; k++) {
      const a = rand(0, 6.28), dd = rand(0, p.r * 0.85), sp = rand(60, 280);
      parts.push({
        type: 'chunk', x: p.x + Math.cos(a) * dd, y: p.y + Math.sin(a) * dd,
        vx: Math.cos(a) * sp + dir * rand(0, 140), vy: Math.sin(a) * sp - rand(120, 320),
        r: rand(1.8, Math.max(3, p.r * 0.2)), life: rand(1.4, 2.2), max: 2.2, landed: false
      });
    }
    puff(p.x, p.y, 8);
  }
  const top = L[L.length - 1];
  floatText(pick(tr(['와르르!', '으악!', '털썩!', '와장창!'], ['哗啦啦！', '啊啊啊！', '塌了！', '稀里哗啦！'])), top.x, top.y - 30, '#ff8fa3', 26);
  shake = 0.25;
}
function collide() {
  const gs = stacks.filter(s => s.state === 'ground' && !s.dead);
  const mov = (s, o) => { if (s.balls.length > 1) return 0; if (drag && drag.s === s) return o.balls.length > 1 ? 1 : 0; return 1; };
  for (let i = 0; i < gs.length; i++) for (let j = i + 1; j < gs.length; j++) {
    const a = gs[i], b = gs[j], ra = a.balls[0].r, rb = b.balls[0].r;
    const d = b.x - a.x, min = (ra + rb) * 0.95;
    if (Math.abs(d) >= min) continue;
    const ma = mov(a, b), mb = mov(b, a); if (ma + mb === 0) continue;
    const dir = Math.sign(d) || 1, ov = min - Math.abs(d);
    a.x -= dir * ov * ma / (ma + mb); b.x += dir * ov * mb / (ma + mb);
    if (ma && !(drag && drag.s === a)) a.vx = -dir * 140;
    if (mb && !(drag && drag.s === b)) b.vx = dir * 140;
  }
}
// 굴리기: 좌우로 굴리면 커짐 (최대 크기 제한)
function roll(s, dx) {
  const b = s.balls[0];
  const nx = clamp(s.x + dx, b.r, W - b.r); dx = nx - s.x; s.x = nx;
  b.rot += dx / b.r;
  const ad = Math.abs(dx); if (ad < 0.01) return;
  const depth = GROUND - snowTop(s.x);
  digSnow(s.x, b.r * 0.8, ad * 0.045);
  const f = depth > 12 ? 1 : 0.25;
  if (b.r < MAXR) {
    b.r = Math.min(MAXR, b.r + ad * 0.04 * f * (1 - 0.78 * (b.r - MINR) / (MAXR - MINR)));
    if (b.r >= MAXR && !b.maxed) { b.maxed = true; floatText(tr('최대 크기!', '最大啦！'), s.x, snowTop(s.x) - b.r * 2 - 10, '#bde0fe', 18); }
  }
  if (Math.random() < ad * 0.06) puff(s.x - Math.sign(dx) * b.r * 0.7, snowTop(s.x) - 2, 1);
}

/* ================= 꾸미기 ================= */
const HATS = ['top', 'beanie', 'santa', 'bucket', 'beanie', 'top'];
const SCARVES = ['#e63946', '#2a9d8f', '#f4a261', '#4361ee', '#9b5de5', '#06d6a0'];
// [종류, 가중치(나올 확률), 등장 메시지]
const KINDS = [
  ['normal', 24, '짜잔! ☃', '当当当！☃'],
  ['santa', 6, '🎅 산타 눈사람! 호호호', '🎅 圣诞老人雪人！吼吼吼'],
  ['cat', 6, '🐱 고양이 눈사람! 냥~', '🐱 猫猫雪人！喵~'],
  ['rabbit', 5, '🐰 토끼 눈사람! 깡총', '🐰 兔兔雪人！蹦蹦'],
  ['bungeo', 6, '🐟 붕어빵 든 눈사람!', '🐟 拿着鲷鱼烧的雪人！'],
  ['chef', 5, '👨‍🍳 군고구마 셰프 눈사람!', '👨‍🍳 烤红薯大厨雪人！'],
  ['muff', 5, '🎀 털귀마개 눈사람!', '🎀 毛绒耳罩雪人！'],
  ['grandpa', 5, '👴 할아버지 눈사람! 허허', '👴 爷爷雪人！呵呵'],
  ['berry', 5, '🍓 딸기 모자 눈사람!', '🍓 草莓帽雪人！'],
  ['melting', 4, '🥵 녹고 있는 눈사람… 더워…', '🥵 正在融化的雪人… 好热…'],
  ['pirate', 4, '🏴‍☠️ 해적 눈사람 등장!', '🏴‍☠️ 海盗雪人登场！'],
  ['bear', 4, '🧸 곰돌이 모자 눈사람!', '🧸 小熊帽雪人！'],

  ['sculpt', 3, '🔨 조각가 등장! 깎는 중…', '🔨 雕刻家来了！雕刻中…'],
  ['golden', 1.2, '🌟 초희귀!! 황금 눈사람!!', '🌟 超稀有！！黄金雪人！！']

const KIND_SET = {
  king: { hat: 'crown', btn: '#ffd166' },
  shades: { hat: () => pick(['none', 'beanie', 'top']) },
  sculpt: { hat: 'none', statue: () => { const k = pick(['palace', 'santa', 'reindeer'].filter(x => x !== lastStatue)); lastStatue = k; return k; } },

const SAYS_ZH = {
  normal: ['你好！', '好冷~', '下雪啦！', '我帅不帅？'],
  santa: ['吼吼吼！', '你今年乖不乖？', '谁要礼物~'],
  cat: ['喵', '喵呜~', '想吃小鱼干', '呼噜呼噜…'],

  ctx.fillStyle = 'rgba(255,248,220,.85)'; ctx.font = '13px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText(inZone ? tr('놓으면 대롱대롱 걸려요!', '松手就能挂起来啦！') : tr('↑ 여기로 올리면 화면 위에 매달 수 있어요', '↑ 拖到这里就能挂在屏幕上方'), W / 2, hz - 12);
  ctx.textAlign = 'left';
  if (inZone) {
    const it = drag.it;
    ctx.setLineDash([4, 5]); ctx.strokeStyle = 'rgba(255,248,220,.8)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(it.x, 0); ctx.lineTo(it.x, it.y - it.size * 0.55); ctx.stroke(); ctx.setLineDash([]);
  }
}

/* ================= 그리기: 파티클 ================= */
function drawParts() {
  for (const p of parts) {
    const al = clamp(p.life / (p.max || 1), 0, 1);
    if (p.type === 'puff') { ctx.fillStyle = `rgba(255,255,255,${al * 0.9})`; ell(p.x, p.y, p.r, p.r, 0); }
    else if (p.type === 'spark') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(time * 3); ctx.fillStyle = `rgba(255,236,150,${al})`;
      const r = p.r; ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * .25, -r * .25); ctx.lineTo(r, 0); ctx.lineTo(r * .25, r * .25); ctx.lineTo(0, r); ctx.lineTo(-r * .25, r * .25); ctx.lineTo(-r, 0); ctx.lineTo(-r * .25, -r * .25); ctx.fill(); ctx.restore();
    }
    else if (p.type === 'chip') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = `rgba(240,248,255,${al})`; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); }
    else if (p.type === 'drip') { ctx.fillStyle = `rgba(170,215,255,${al})`; ell(p.x, p.y, 2.2, 3.2, 0); }
    else if (p.type === 'chunk') { ctx.fillStyle = `rgba(250,252,255,${Math.min(1, al * 1.4)})`; ell(p.x, p.y, p.r, p.r, 0); ctx.fillStyle = `rgba(200,205,240,${Math.min(0.6, al)})`; ell(p.x + p.r * 0.2, p.y + p.r * 0.3, p.r * 0.6, p.r * 0.45, 0); }
    else if (p.type === 'fw' || p.type === 'flash') {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      if (p.type === 'flash') {
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        g.addColorStop(0, `rgba(255,255,240,${al * 0.8})`); g.addColorStop(1, 'rgba(255,255,240,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
      } else {
        const tw = p.t > p.max * 0.55 ? 0.55 + 0.45 * Math.sin(time * 30 + p.seed) : 1;
        const a = Math.min(1, al * 1.5) * tw;
        if (p.px !== undefined) { ctx.strokeStyle = p.color; ctx.globalAlpha = a * 0.6; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke(); }
        const k = p.small ? 0.65 : 1;
        ctx.globalAlpha = a * 0.28; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 5 * k, 0, 7); ctx.fill();
        ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(p.x, p.y, 1.9 * k, 0, 7); ctx.fill();
      }
      ctx.restore();
    }
    else if (p.type === 'bubble') {
      ctx.globalAlpha = Math.min(1, al * 3);
      ctx.font = 'bold 13px ' + FONT;
      const w = ctx.measureText(p.text).width + 18, h = 26, bx = p.x - w / 2 + 10, by = p.y - h - 8;
      ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.beginPath(); ctx.roundRect(bx, by, w, h, 12); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx + 10, by + h - 2); ctx.lineTo(bx + 2, by + h + 9); ctx.lineTo(bx + 22, by + h - 2); ctx.fill();
      ctx.fillStyle = '#23324a'; ctx.textAlign = 'left'; ctx.fillText(p.text, bx + 9, by + 17.5);
      ctx.globalAlpha = 1;
    }
    else if (p.type === 'coal') { ctx.fillStyle = `rgba(27,27,34,${Math.min(1, al * 2)})`; ell(p.x, p.y, p.r, p.r, 0); }
    else if (p.type === 'hat') { ctx.save(); ctx.globalAlpha = Math.min(1, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.rot); drawHat(p.kind, p.r, p.color); ctx.restore(); }
    else if (p.type === 'shadesfly') {
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = '#1a1a2e'; const r = p.r;
      ctx.beginPath(); ctx.roundRect(-r * .62, -r * .17, r * .55, r * .34, r * .12); ctx.roundRect(r * .07, -r * .17, r * .55, r * .34, r * .12); ctx.fill(); ctx.restore();
    }
    else if (p.type === 'text') {
      ctx.globalAlpha = Math.min(1, al * 1.6);
      ctx.font = `bold ${p.size}px ${FONT}`; ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(15,35,65,.75)'; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1; ctx.textAlign = 'left';
    }
  }
}
function drawCloseBtn() {
  if (!OV) return;
  const x = 22, y = GROUND - 70;
  ctx.fillStyle = hoverState && Math.hypot(mouse.x - x, mouse.y - y) < 13 ? 'rgba(230,57,70,.9)' : 'rgba(20,40,70,.45)';
  ell(x, y, 12, 12, 0); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(x - 4.5, y - 4.5); ctx.lineTo(x + 4.5, y + 4.5); ctx.moveTo(x + 4.5, y - 4.5); ctx.lineTo(x - 4.5, y + 4.5); ctx.stroke();
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-3, 3) * shake * 4, rand(-2, 2) * shake * 4);
  drawBackground();
  drawTaskbar();
  drawSnow();
  for (const s of stacks) drawShadow(s);
  const dragged = drag && drag.s;
  for (const s of stacks) if (s !== dragged) drawStack(s);
  if (dragged) drawStack(dragged);
  drawHangZone();
  for (const it of items) if (it.state === 'hang') drawRope(it);
  for (const it of items) if (it.state !== 'drag') drawItem(it);
  if (drag && drag.it) drawItem(drag.it);
  drawParts();
  drawFlakes();
  drawCloseBtn();
  ctx.restore();
}

/* ================= 입력 ================= */
function hitStack(x, y) {
  for (let k = stacks.length - 1; k >= 0; k--) {
    const s = stacks[k]; if (s.melt) continue; const L = layout(s);
    for (let i = L.length - 1; i >= 0; i--) { const p = L[i]; if ((x - p.x) ** 2 + (y - p.y) ** 2 < (p.r + 5) ** 2) return { s, i, L }; }
  }
  return null;
}
function hitItem(x, y) {
  for (let k = items.length - 1; k >= 0; k--) { const it = items[k]; if (it.state === 'launch') continue; if (Math.hypot(x - it.x, y - it.y) < it.size * 0.62) return it; }
  return null;
}
const closeHit = (x, y) => OV && Math.hypot(x - 22, y - (GROUND - 70)) < 14;
function updateHover() {
  const over = !!drag || !!hitItem(mouse.x, mouse.y) || !!hitStack(mouse.x, mouse.y) || closeHit(mouse.x, mouse.y);
  cv.style.cursor = drag ? 'grabbing' : over ? 'grab' : 'default';
  if (OV && over !== hoverState) OV.setIgnore(!over);
  hoverState = over;
}
function startCarry() {
  const s = drag.s; drag.mode = 'carry'; s.state = 'carry'; s.debris = false;
  drag.offX = s.x - mouse.x; drag.offY = s.y - mouse.y; s.cvx = 0; s.skip = null;
}
cv.addEventListener('pointerdown', e => {
  const x = e.clientX, y = e.clientY; mouse.x = x; mouse.y = y;
  if (closeHit(x, y)) { OV.quit(); return; }
  hideHintSoon();
  const it = hitItem(x, y);
  if (it) {
    if (it.state === 'hang') sparkle(it.rope.ax, 6, 3);
    it.state = 'drag'; it.rope = null; it.vx = 0;
    items.splice(items.indexOf(it), 1); items.push(it);
    drag = { type: 'item', it, offX: it.x - x, offY: it.y - y, sx: x, sy: y };
  } else {
    const h = hitStack(x, y);
    if (h) {
      stacks.splice(stacks.indexOf(h.s), 1); stacks.push(h.s);
      drag = { type: 'stack', s: h.s, i: h.i, sx: x, sy: y, lastX: x, mode: 'press', offX: h.s.x - x, offY: h.s.y - y };
    }
  }
  if (drag) { try { cv.setPointerCapture(e.pointerId); } catch (_) { } }
  updateHover();
});
cv.addEventListener('pointermove', e => {
  const x = e.clientX, y = e.clientY, now = performance.now();
  const dx = x - mouse.x, dy = y - mouse.y, dtm = Math.max(8, now - mouse.t) / 1000;
  mouse.svx = mouse.svx * 0.55 + (dx / dtm) * 0.45; mouse.svy = mouse.svy * 0.55 + (dy / dtm) * 0.45;
  mouse.x = x; mouse.y = y; mouse.t = now;
  if (!drag || drag.type === 'stack') sweep(x, y, dx, dy);
  if (drag && drag.type === 'stack') {
    const s = drag.s;
    if (drag.mode === 'press') {
      const ddx = x - drag.sx, ddy = y - drag.sy;
      if (s.balls.length === 1 && s.state === 'ground') {
        if (-ddy > 26 && -ddy > Math.abs(ddx)) startCarry();
        else if (Math.abs(ddx) > 4) { drag.mode = 'roll'; drag.lastX = x; }
      } else if (Math.hypot(ddx, ddy) > 6) startCarry();
    }
    if (drag.mode === 'roll') {
      if (s.state !== 'ground' || drag.sy - y > 45) startCarry();
      else { roll(s, x - drag.lastX); drag.lastX = x; }
    }
  }
  updateHover();
});
function endDrag() {
  if (!drag) return;
  if (drag.type === 'stack') {
    const s = drag.s;
    if (drag.mode === 'press') {
      const L = layout(s), n = L.length;
      if (n >= 2 && drag.i === n - 1 && s.state === 'ground') {
        if (!s.deco) decorate(s);
        else { s.omega += pick([-1, 1]) * 0.25; say(s, pick([...(SAYS[s.deco.kind] || SAYS.normal), '❤', tr('간지러워!', '好痒！'), tr('헤헤', '嘿嘿')])); s.deco.sayT = rand(6, 11); }
      } else if (n === 1 && s.state === 'ground') { s.state = 'fall'; s.vy = -320; puff(s.x, s.y - 2, 3); }
      else if (s.state === 'ground') s.omega += pick([-1, 1]) * 0.12;
    } else if (drag.mode === 'carry') {
      s.state = 'fall'; s.vx = clamp(mouse.svx * 0.7, -900, 900); s.vy = clamp(mouse.svy * 0.7, -900, 1400); s.skip = null;
    } else if (drag.mode === 'roll') {
      s.vx = clamp(mouse.svx * 0.5, -600, 600);
    }
  } else if (drag.type === 'item') {
    const it = drag.it;
    if (it.kind === 'firework') { if (it.y < GROUND - 90) launch(it); else { it.state = 'fly'; it.vx = 0; it.vy = 0; it.vr = 0; } }
    else if (it.y < HANG_ZONE()) hang(it);
    else { it.state = 'fly'; it.vx = clamp(mouse.svx * 0.6, -900, 900); it.vy = clamp(mouse.svy * 0.6, -900, 900); it.vr = rand(-4, 4); }
  }
  drag = null; updateHover();
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('pointerleave', () => { if (!IS_OVERLAY) return; });
window.addEventListener('blur', endDrag);
window.addEventListener('resize', () => {
  const oldW = W; resize();
  const k = oldW > 0 ? W / oldW : 1;
  for (const s of stacks) s.x = clamp(s.x * k, 20, W - 20);
  for (const it of items) { if (it.rope) { it.rope.ax *= k; for (const p of it.rope.pts) { p.x *= k; p.px *= k; } } else it.x *= k; }
});

let hintTimer = null;
function hideHintSoon() { if (hintTimer) return; hintTimer = setTimeout(() => hintEl.style.opacity = 0, 9000); }
window.addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') { hintEl.style.opacity = hintEl.style.opacity === '0' ? 1 : 0; } });

/* ================= 시작 ================= */
resize();
[0.3, 0.5, 0.7].forEach(f => spawnBall(W * f));
if (IS_OVERLAY) setTimeout(() => hintEl.style.opacity = 0, 12000);
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now; time += dt;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
